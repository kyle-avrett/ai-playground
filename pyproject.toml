[project]
name = "ai-playground"
version = "0.1.0"
description = "A `uv` project to play around with AI Engineering"
readme = "README.md"
authors = [
    { name = "Kyle Avrett", email = "kyle@upsurge.consulting" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deepagents>=0.7.13",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "litellm>=1.83.0",
    "openai>=3.12.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
