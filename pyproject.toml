[project]
name = "ai-playground"
version = "0.1.0"
description = "A `uv` project to play around with AI Engineering"
readme = "README.md"
authors = [
    { name = "Kyle Avrett", email = "kyle@upsurge.consulting" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "deepagents>=0.7.13",
    "fastmcp>=4.0.3",
    "gradio>=6.27.0",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langfuse>=4.15.4",
    "litellm>=1.83.0",
    "llama-index>=0.12.0",
    "mlflow>=3.16.1",
    "openai>=2,<3",
    "openai-agents>=0.20.0",
    "openinference-instrumentation-openai-agents>=2.4.1",
    "pandas>=3.0.5",
    "pydantic-ai>=2.31.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["settings"]
